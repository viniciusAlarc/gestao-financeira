name: Importar Pluggy

on:
  schedule:
    # Duas vezes por dia: 10:00 e 19:00 UTC (07:00 e 16:00 em Brasília).
    # O MeuPluggy atualiza a cada 24h; as duas execuções reduzem a espera.
    - cron: "0 10,19 * * *"
  workflow_dispatch:

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint do app
        run: |
          curl -fsS --max-time 300 -X POST \
            "https://viniciusapps.pythonanywhere.com/tarefas/importar-pluggy/" \
            -H "X-Import-Token: ${{ secrets.IMPORT_TOKEN }}"
