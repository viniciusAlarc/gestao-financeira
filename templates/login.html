{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}
{% block classe_main %} pagina-login{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">Entrar</h1>
<form method="post" class="cartao-login">
  {% csrf_token %}
  {% if form.errors %}
    <p class="erro" id="erro-login" role="alert">Não foi possível entrar. Confira usuário e senha.</p>
  {% endif %}
  <label for="id_username">Usuário</label>
  <input type="text" name="username" id="id_username" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" autofocus required{% if form.errors %} aria-invalid="true" aria-describedby="erro-login"{% endif %}>
  <label for="id_password">Senha</label>
  <input type="password" name="password" id="id_password" autocomplete="current-password" required{% if form.errors %} aria-invalid="true" aria-describedby="erro-login"{% endif %}>
  <button type="submit" class="botao-primario">Entrar</button>
</form>
{% endblock %}
