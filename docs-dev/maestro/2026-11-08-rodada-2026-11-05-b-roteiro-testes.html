<meta charset="utf-8">

<title>Roteiro rodada B</title>
<style>
  :root {
    --bg: #f6f7f6; --card: #ffffff; --texto: #1f2421; --suave: #5f6b63; --borda: #d9dedb;
    --verde: #1B5E20; --verde-claro: #e8f5e9; --vermelho: #b3261e; --vermelho-claro: #fdecea;
    --ambar-claro: #fff8e1; --ambar: #c79100; --code: #eef1ef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --card: #1d2320; --texto: #e6ebe8; --suave: #a3aea8; --borda: #34403a;
      --verde: #81c784; --verde-claro: #1f3322; --vermelho: #f2938c; --vermelho-claro: #3a2321;
      --ambar-claro: #3a3220; --ambar: #ffca28; --code: #27302c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .pagina { max-width: 1100px; margin: 0 auto; padding: 0 16px 80px; }
  h1 { font-size: 1.45rem; margin: 24px 0 8px; }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  h3 { font-size: 1rem; margin: 20px 0 8px; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  .intro p { margin: 4px 0; color: var(--suave); }

  /* Barra de progresso fixa no topo */
  .topo { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0;
          border-bottom: 1px solid var(--borda); margin-bottom: 16px; }
  .topo-linha { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .contagem { font-weight: 600; }
  .contagem .ok { color: var(--verde); } .contagem .falha { color: var(--vermelho); }
  .barra { flex: 1 1 200px; height: 8px; background: var(--borda); border-radius: 4px; overflow: hidden; display: flex; }
  .barra span { display: block; height: 100%; }
  .barra .b-ok { background: var(--verde); } .barra .b-falha { background: var(--vermelho); }
  .botoes { display: flex; gap: 8px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--borda); background: var(--card);
           color: var(--texto); border-radius: 6px; padding: 5px 12px; }
  button:hover { border-color: var(--suave); }
  button.primario { background: var(--verde); border-color: var(--verde); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primario { color: #10200f; } }

  /* Índice */
  .indice { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .indice a { text-decoration: none; color: var(--texto); border: 1px solid var(--borda); background: var(--card);
              border-radius: 14px; padding: 2px 10px; font-size: .85rem; white-space: nowrap; }
  .indice a .n { color: var(--suave); margin-left: 4px; }
  .indice a.feito { border-color: var(--verde); }
  .indice a.tem-falha { border-color: var(--vermelho); }

  /* Seção */
  .secao { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .secao-cab { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .secao-cab .n { color: var(--suave); font-size: .85rem; }
  .secao p { margin: 8px 0; }
  .nota { background: var(--ambar-claro); border: 1px solid var(--ambar); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
  .nota p { margin: 2px 0; }
  ul { margin: 8px 0; padding-left: 20px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; font-size: .8rem; color: var(--suave); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--borda); }
  td { padding: 8px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  td.id { white-space: nowrap; color: var(--suave); font-variant-numeric: tabular-nums; width: 48px; }
  tr.aviso td { background: var(--ambar-claro); }
  tr.st-ok td { background: var(--verde-claro); }
  tr.st-falha td { background: var(--vermelho-claro); }
  td.acao { width: 170px; }
  .status { display: flex; gap: 4px; }
  .status button { padding: 3px 9px; font-size: .85rem; }
  .status button.sel-ok { background: var(--verde); border-color: var(--verde); color: #fff; }
  .status button.sel-falha { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  textarea { width: 100%; margin-top: 6px; font: inherit; font-size: .85rem; border: 1px solid var(--borda);
             border-radius: 6px; padding: 4px 6px; background: var(--card); color: var(--texto); resize: vertical; min-height: 34px; }

  /* Resultado */
  #painel-resultado .vazio { color: var(--suave); }
  #painel-resultado li { margin-bottom: 6px; }

  @media (max-width: 640px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border-bottom: 1px solid var(--borda); padding: 6px 0; }
    td { border: 0; padding: 3px 4px; }
    td.id { width: auto; font-weight: 600; }
    td.acao { width: auto; }
    td[data-rotulo]::before { content: attr(data-rotulo) ": "; font-weight: 600; color: var(--suave); }
  }
</style>
</head>

<div class="pagina">
  <h1 id="titulo"></h1>
  <div class="intro" id="intro"></div>

  <div class="topo">
    <div class="topo-linha">
      <span class="contagem" id="contagem"></span>
      <div class="barra" id="barra"><span class="b-ok"></span><span class="b-falha"></span></div>
      <div class="botoes">
        <button class="primario" id="copiar">Copiar resultado</button>
        <button id="limpar">Limpar marcações</button>
      </div>
    </div>
    <nav class="indice" id="indice"></nav>
  </div>

  <main id="conteudo"></main>
</div>

<script>
(function () {
  // ---------- estado salvo no navegador ----------
  let estado = {};
  try { estado = JSON.parse(localStorage.getItem(CHAVE) || '{}') || {}; } catch (e) { estado = {}; }
  const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} };

  // ---------- markdown simples em linha ----------
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function inline(s) {
    let h = esc(s);
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 (<code>$2</code>)');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return h;
  }
  const slug = t => 'sec-' + t.toLowerCase().normalize('NFD').replace(/[^\w]+/g, '-');

  // ---------- montar a página ----------
  document.getElementById('titulo').textContent = DADOS.titulo;
  document.getElementById('intro').innerHTML = DADOS.intro.filter(Boolean).map(l => `<p>${inline(l)}</p>`).join('');

  const passos = [];          // {id, secao, faca, deve}
  const conteudo = document.getElementById('conteudo');
  let cartao = null;          // as subseções (###) entram no cartão da seção anterior

  DADOS.secoes.forEach(sec => {
    if (sec.nivel === 2 || !cartao) {
      cartao = document.createElement('section');
      cartao.className = 'secao';
      cartao.id = slug(sec.titulo);
      cartao.dataset.titulo = sec.titulo;
      cartao.innerHTML = `<div class="secao-cab"><h2>${inline(sec.titulo)}</h2><span class="n"></span></div>`;
      conteudo.appendChild(cartao);
    } else {
      cartao.insertAdjacentHTML('beforeend', `<h3>${inline(sec.titulo)}</h3>`);
    }
    const tituloSecao = cartao.dataset.titulo;

    sec.blocos.forEach(b => {
      if (b.tipo === 'par') cartao.insertAdjacentHTML('beforeend', `<p>${inline(b.texto)}</p>`);
      if (b.tipo === 'nota') cartao.insertAdjacentHTML('beforeend',
        `<div class="nota">${b.linhas.filter(Boolean).map(l => `<p>${inline(l)}</p>`).join('')}</div>`);
      if (b.tipo === 'lista') cartao.insertAdjacentHTML('beforeend',
        `<ul>${b.itens.map(i => `<li>${inline(i)}</li>`).join('')}</ul>`);
      if (b.tipo === 'tabela') {
        const conferivel = b.cab[b.cab.length - 1] === '✔';
        const cab = conferivel ? b.cab.slice(0, -1) : b.cab;
        const t = document.createElement('table');
        t.innerHTML = `<thead><tr>${cab.map(c => `<th>${inline(c)}</th>`).join('')}${conferivel ? '<th>Resultado</th>' : ''}</tr></thead>`;
        const tb = document.createElement('tbody');
        b.linhas.forEach(cells => {
          const tr = document.createElement('tr');
          const vals = conferivel ? cells.slice(0, -1) : cells;
          vals.forEach((v, k) => {
            const td = document.createElement('td');
            if (k === 0 && cab[0] === '#') td.className = 'id';
            else td.dataset.rotulo = cab[k];
            td.innerHTML = inline(v);
            tr.appendChild(td);
          });
          if (vals.join(' ').includes('⚠️')) tr.classList.add('aviso');
          if (conferivel) {
            const id = vals[0];
            const iFaca = cab.indexOf('Faça'), iDeve = cab.indexOf('Deve ver');
            passos.push({ id, secao: tituloSecao, faca: vals[iFaca] || '', deve: vals[iDeve] || '', tr, cartao });
            const td = document.createElement('td');
            td.className = 'acao';
            td.innerHTML = `<div class="status">
                <button data-v="ok" title="Bateu com o esperado">Ok</button>
                <button data-v="falha" title="Não bateu">Falhou</button></div>
              <textarea placeholder="Anotação" rows="1"></textarea>`;
            const ta = td.querySelector('textarea');
            ta.value = (estado[id] && estado[id].nota) || '';
            td.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
              const atual = estado[id] && estado[id].st;
              estado[id] = Object.assign({}, estado[id], { st: atual === btn.dataset.v ? null : btn.dataset.v });
              salvar(); atualizar();
            }));
            ta.addEventListener('input', () => {
              estado[id] = Object.assign({}, estado[id], { nota: ta.value }); salvar(); atualizarResultado();
            });
            tr.appendChild(td);
          }
          tb.appendChild(tr);
        });
        t.appendChild(tb);
        cartao.appendChild(t);
      }
    });
  });

  // Painel de resultado, dentro do cartão "Resultado"
  const cartaoResultado = [...document.querySelectorAll('.secao')].find(s => s.dataset.titulo === 'Resultado');
  const painel = document.createElement('div');
  painel.id = 'painel-resultado';
  if (cartaoResultado) cartaoResultado.querySelector('.secao-cab').after(painel);

  // ---------- atualizar contagens ----------
  function atualizarResultado() {
    const falhas = passos.filter(p => estado[p.id] && estado[p.id].st === 'falha');
    const comNota = passos.filter(p => estado[p.id] && estado[p.id].st !== 'falha' && (estado[p.id].nota || '').trim());
    if (!falhas.length && !comNota.length) {
      painel.innerHTML = '<p class="vazio">Nenhuma falha marcada ainda. O que você marcar como "Falhou" aparece aqui.</p>';
      return;
    }
    const item = p => `<li><strong>${esc(p.id)}</strong> (${esc(p.secao)}): ${inline(p.deve)}${
      (estado[p.id].nota || '').trim() ? `<br><em>Anotação:</em> ${esc(estado[p.id].nota)}` : ''}</li>`;
    painel.innerHTML = (falhas.length ? `<h3>Falhas (${falhas.length})</h3><ul>${falhas.map(item).join('')}</ul>` : '')
      + (comNota.length ? `<h3>Anotações em passos que não falharam</h3><ul>${comNota.map(item).join('')}</ul>` : '');
  }

  function atualizar() {
    let ok = 0, falha = 0;
    passos.forEach(p => {
      const st = estado[p.id] && estado[p.id].st;
      p.tr.classList.toggle('st-ok', st === 'ok');
      p.tr.classList.toggle('st-falha', st === 'falha');
      p.tr.querySelectorAll('.status button').forEach(b => {
        b.classList.toggle('sel-ok', b.dataset.v === 'ok' && st === 'ok');
        b.classList.toggle('sel-falha', b.dataset.v === 'falha' && st === 'falha');
      });
      if (st === 'ok') ok++; if (st === 'falha') falha++;
    });
    const n = passos.length;
    document.getElementById('contagem').innerHTML =
      `${ok + falha} de ${n} conferidos · <span class="ok">${ok} ok</span> · <span class="falha">${falha} falharam</span>`;
    const barra = document.getElementById('barra').children;
    barra[0].style.width = (ok / n * 100) + '%';
    barra[1].style.width = (falha / n * 100) + '%';

    // índice com a contagem por seção
    const ind = document.getElementById('indice');
    ind.innerHTML = '';
    document.querySelectorAll('.secao').forEach(c => {
      const ps = passos.filter(p => p.cartao === c);
      const feitos = ps.filter(p => estado[p.id] && estado[p.id].st).length;
      const temFalha = ps.some(p => estado[p.id] && estado[p.id].st === 'falha');
      if (ps.length) c.querySelector('.secao-cab .n').textContent = `${feitos} de ${ps.length}`;
      const a = document.createElement('a');
      a.href = '#' + c.id;
      a.textContent = c.dataset.titulo.split('.')[0].split(':')[0];
      if (ps.length) a.insertAdjacentHTML('beforeend', `<span class="n">${feitos}/${ps.length}</span>`);
      if (ps.length && feitos === ps.length) a.classList.add('feito');
      if (temFalha) a.classList.add('tem-falha');
      ind.appendChild(a);
    });
    atualizarResultado();
  }

  // ---------- botões ----------
  document.getElementById('copiar').addEventListener('click', () => {
    const ok = passos.filter(p => estado[p.id] && estado[p.id].st === 'ok').length;
    const falhas = passos.filter(p => estado[p.id] && estado[p.id].st === 'falha');
    const notas = passos.filter(p => estado[p.id] && estado[p.id].st !== 'falha' && (estado[p.id].nota || '').trim());
    const pend = passos.length - ok - falhas.length;
    const limpo = s => s.replace(/\*\*|`/g, '');
    let txt = `${DADOS.titulo}\nConferidos ${ok + falhas.length} de ${passos.length}: ${ok} ok, ${falhas.length} falharam, ${pend} sem marcar.\n`;
    if (falhas.length) txt += '\nFalhas:\n' + falhas.map(p =>
      `- ${p.id} (${p.secao}). Esperado: ${limpo(p.deve)}${(estado[p.id].nota || '').trim() ? `\n  Aconteceu: ${estado[p.id].nota.trim()}` : ''}`).join('\n') + '\n';
    if (notas.length) txt += '\nAnotações:\n' + notas.map(p => `- ${p.id}: ${estado[p.id].nota.trim()}`).join('\n') + '\n';
    const btn = document.getElementById('copiar');
    const feito = () => { btn.textContent = 'Copiado'; setTimeout(() => btn.textContent = 'Copiar resultado', 1500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(feito, () => fallback(txt, feito));
    else fallback(txt, feito);
  });
  function fallback(txt, feito) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); feito(); } catch (e) { alert(txt); } ta.remove();
  }
  document.getElementById('limpar').addEventListener('click', () => {
    if (!confirm('Apagar todas as marcações e anotações deste roteiro?')) return;
    estado = {}; salvar();
    document.querySelectorAll('td.acao textarea').forEach(t => t.value = '');
    atualizar();
  });

  atualizar();
})();
</script>
